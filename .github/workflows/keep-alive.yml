name: Keep Backend Alive

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Wake up backend
        run: |
          BACKEND_URL="https://food-system-backend-i3uc.onrender.com/api/health"
          echo "Pinging: $BACKEND_URL"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -m 45 "$BACKEND_URL")
          echo "HTTP Status: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Backend is awake and healthy!"
          else
            echo "⚠️ Got status $RESPONSE — backend may still be waking up"
          fi
